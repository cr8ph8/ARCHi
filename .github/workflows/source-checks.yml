name: Native profile validation
on:
  push:
    branches: [codex/validate-native-profile-writes]
permissions:
  contents: read
jobs:
  profile:
    name: Native profile tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Report Swift toolchain
        run: swift --version
      - name: Test profile writes and recovery
        run: >-
          swift test --package-path desktop
          --filter 'KeptLessonsTests|LessonStoreTests|DesktopRecoveryIntegrationTests|DesktopProfileBackupTests|DesktopProfileRecoveryTests|DesktopRetentionStateTests|EvolutionSaveConflictTests|MarketplacePersistenceTests'
