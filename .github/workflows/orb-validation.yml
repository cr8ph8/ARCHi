name: Orb integration checks
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'unity/ARCHi/Assets/ARCHi/**'
      - 'scripts/*orb*'
      - 'script/*orb*'
      - 'scripts/tests/test_orb_runtime_acceptance.py'
      - 'scripts/orb-checks/**'
      - '.github/workflows/orb-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts
      - run: python3 scripts/check_orb_protocol.py
      - name: Check synthetic runtime evidence and launcher failure boundaries
        run: python3 -m unittest scripts.tests.test_orb_runtime_acceptance -v
      - run: node --test scripts/orb-session-bridge.test.mjs
      - run: npx vitest run src/companion-activities/broken-relay.test.ts src/journey-activity.test.ts src/battle-engine.test.ts src/presence-sequence.test.ts
      - run: npm run build
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Existing native views use Swift 6.2 isolated conformances.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - run: xcodebuild -version
      - run: swift --version
      - run: swift test --package-path desktop --filter OrbPresentationTests
      - run: swift test --package-path desktop --filter UnityPresentationTests
      - name: Check existing graph and geometry contracts
        run: >-
          swift test --package-path desktop
          --filter 'CompanionGraphTests|LiminalGraphMorphTests|LiminalSurfaceLightTests/testExpression|KnowledgeParticleFieldTests/test(Stable|Topology|Framing|Focus|Endpoint|Caps|SharedDisplay|Reviewed|SeedKeeps)|VelaRenderingTests/testReduceMotion'
