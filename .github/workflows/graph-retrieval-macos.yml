name: Graph retrieval on macOS
on:
  pull_request:
    paths:
      - 'desktop/Sources/ARCHiDesktop/CompanionGraph*.swift'
      - 'desktop/Tests/ARCHiDesktopTests/GraphRetrieval*.swift'
      - '.github/workflows/graph-retrieval-macos.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test graph projection, search and grading
        run: swift test --package-path desktop --filter 'CompanionGraph|GraphRetrieval'
      - name: Compare the three modes with local Qwen on this disposable Mac
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, '[benchmark:local-qwen]')
        env:
          ARCHI_RETRIEVAL_REPORT: ${{ runner.temp }}/archi-retrieval.json
          ARCHI_RETRIEVAL_MODEL: qwen3:8b
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NO_CLOUD: '1'
        run: |
          command -v ollama || brew install ollama
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull "$ARCHI_RETRIEVAL_MODEL"
          swift test --skip-build --package-path desktop --filter GraphRetrievalModelTests.testPairedLocalQwen
          python3 - "$ARCHI_RETRIEVAL_REPORT" <<'PY'
          import json, statistics, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rows = report["trials"]
          assert len(rows) == report["plannedTrials"] == 21
          for mode in ("full", "keyword", "linked"):
              arm = [r for r in rows if r["mode"] == mode]
              print(mode, "trials", len(arm), "correct verdicts", sum(r["correctVerdict"] for r in arm),
                    "exact citations", sum(r["correctCitations"] for r in arm),
                    "jointly correct", sum(r["status"] == "PASS" for r in arm),
                    "mean prompt tokens", round(statistics.mean(r["promptTokens"] for r in arm), 1),
                    "median end-to-end ms", round(statistics.median(r["endToEndMs"] for r in arm)))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: graph-retrieval-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/archi-retrieval.json
          if-no-files-found: ignore
          retention-days: 14
