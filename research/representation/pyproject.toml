[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-representation"
version = "0.1.0"
description = "Local Hampton representation and adaptive-state components"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
activation = ["torch>=2.1"]

[project.scripts]
archi-representation = "archi_repe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archi_repe*"]
